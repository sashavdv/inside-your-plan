<div class="min-h-screen text-slate-900">
  <header class="sticky top-0 z-50 border-b border-emerald-100 bg-white/85 backdrop-blur">
    <div class="container-pad flex h-16 items-center justify-between">
      <a class="text-lg font-semibold tracking-tight text-emerald-700" routerLink="/">Inside Your Plan</a>

      <nav class="hidden items-center gap-6 text-sm font-medium md:flex">
        <a class="text-slate-600 hover:text-emerald-700" routerLink="/" routerLinkActive="text-emerald-700" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a class="text-slate-600 hover:text-emerald-700" routerLink="/how-it-works" routerLinkActive="text-emerald-700">Hoe het werkt</a>
        <a class="text-slate-600 hover:text-emerald-700" routerLink="/pricing" routerLinkActive="text-emerald-700">Prijzen</a>
        <a class="text-slate-600 hover:text-emerald-700" routerLink="/architects" routerLinkActive="text-emerald-700">Voor architecten</a>
        <a class="text-slate-600 hover:text-emerald-700" routerLink="/about" routerLinkActive="text-emerald-700">Over ons</a>
        <a class="text-slate-600 hover:text-emerald-700" routerLink="/contact" routerLinkActive="text-emerald-700">Contact</a>
      </nav>

      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-full border border-emerald-100 bg-white px-4 py-2 text-sm font-medium text-emerald-700 md:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle navigation"
      >
        Menu
      </button>
    </div>

    <div *ngIf="menuOpen()" class="border-t border-emerald-100 bg-white md:hidden">
      <div class="container-pad flex flex-col gap-4 py-6 text-sm font-medium">
        <a routerLink="/" (click)="closeMenu()">Home</a>
        <a routerLink="/how-it-works" (click)="closeMenu()">Hoe het werkt</a>
        <a routerLink="/pricing" (click)="closeMenu()">Prijzen</a>
        <a routerLink="/architects" (click)="closeMenu()">Voor architecten</a>
        <a routerLink="/about" (click)="closeMenu()">Over ons</a>
        <a routerLink="/contact" (click)="closeMenu()">Contact</a>
      </div>
    </div>
  </header>

  <main class="py-12">
    <router-outlet></router-outlet>
  </main>

  <footer class="border-t border-emerald-100 bg-emerald-50/60">
    <div class="container-pad flex flex-col items-center gap-3 py-10 text-sm text-slate-600 md:flex-row md:justify-between">
      <p>Inside Your Plan — Limburg, België</p>
      <p>
        <a class="font-medium text-emerald-700" href="mailto:info@lifesizeplans.be">info@lifesizeplans.be</a>
        ·
        <a class="font-medium text-emerald-700" routerLink="/contact">Contact</a>
      </p>
    </div>
  </footer>
</div>
